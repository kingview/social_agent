# Planning-only DeepSeek Harness composition. It deliberately loads no Tools:
# a planning turn cannot browse, download, read files, or mutate external state.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-local
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-openai-compatible:
        displayName: Local OpenAI-compatible Model
        apiKeyEnv: SOCIAL_AGENT_LLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.SOCIAL_AGENT_LLM_BASE_URL ?? 'http://127.0.0.1:11434/v1'
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.SOCIAL_AGENT_LLM_MODEL ?? 'qwen3.5:9b'
            name: Local Social Planner
            contextWindow: 32768
            maxTokens: 4096

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 2048
    compactionRetries: 1
