# Social Agent execution composition. The only model-facing capabilities are
# the allow-listed Python MCP tools; no shell, filesystem editor, web search,
# platform write operation, skill, or subagent is loaded.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-local
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-openai-compatible:
        displayName: Local OpenAI-compatible Model
        apiKeyEnv: SOCIAL_AGENT_LLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.SOCIAL_AGENT_LLM_BASE_URL ?? 'http://127.0.0.1:11434/v1'
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.SOCIAL_AGENT_LLM_MODEL ?? 'qwen3.5:9b'
            name: Local Social Agent
            contextWindow: 32768
            maxTokens: 8192

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: social-tools
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: social
    transport: stdio
    command: !!js process.env.SOCIAL_AGENT_PYTHON
    args: !!js JSON.parse(process.env.SOCIAL_AGENT_MCP_ARGS ?? '["-m","social_ops_agent.mcp_server"]')
    cwd: !!js process.env.SOCIAL_AGENT_PROJECT_ROOT
    env:
      SOCIAL_AGENT_SESSION_REGISTRY: !!js process.env.SOCIAL_AGENT_SESSION_REGISTRY
      SOCIAL_AGENT_OUTPUT_ROOT: !!js process.env.SOCIAL_AGENT_OUTPUT_ROOT
      SOCIAL_AGENT_STATE_ROOT: !!js process.env.SOCIAL_AGENT_STATE_ROOT
      SOCIAL_AGENT_LLM_API_KEY: !!js process.env.SOCIAL_AGENT_LLM_API_KEY
      SOCIAL_AGENT_LLM_BASE_URL: !!js process.env.SOCIAL_AGENT_LLM_BASE_URL
      SOCIAL_AGENT_LLM_MODEL: !!js process.env.SOCIAL_AGENT_LLM_MODEL
      PYTHONPATH: !!js process.env.SOCIAL_AGENT_PYTHONPATH
    toolCallTimeoutMs: 1800000
    failOnStartupError: true

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 4096
    compactionRetries: 1
